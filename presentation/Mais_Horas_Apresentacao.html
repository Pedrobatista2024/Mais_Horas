<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mais Horas - Apresentacao</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111c30; font-family: Segoe UI, Arial, sans-serif; }
    main { width: 100vw; min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .slide { display: none; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
    .slide.active { display: block; }
    .slide img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .counter { position: fixed; right: 18px; bottom: 14px; color: #d8e2ff; background: rgba(15,37,112,.65); padding: 8px 12px; border-radius: 999px; font-size: 14px; }
    @media print { body { background: white; } main { display:block; } .slide { display:block; width:100vw; page-break-after: always; } .counter { display:none; } }
  </style>
</head>
<body>
  <main>
      <section class="slide"><img src="slides/slide-01.png" alt="Slide 1"></section>
      <section class="slide"><img src="slides/slide-02.png" alt="Slide 2"></section>
      <section class="slide"><img src="slides/slide-03.png" alt="Slide 3"></section>
      <section class="slide"><img src="slides/slide-04.png" alt="Slide 4"></section>
      <section class="slide"><img src="slides/slide-05.png" alt="Slide 5"></section>
      <section class="slide"><img src="slides/slide-06.png" alt="Slide 6"></section>
      <section class="slide"><img src="slides/slide-07.png" alt="Slide 7"></section>
      <section class="slide"><img src="slides/slide-08.png" alt="Slide 8"></section>
      <section class="slide"><img src="slides/slide-09.png" alt="Slide 9"></section>
      <section class="slide"><img src="slides/slide-10.png" alt="Slide 10"></section>
      <section class="slide"><img src="slides/slide-11.png" alt="Slide 11"></section>
      <section class="slide"><img src="slides/slide-12.png" alt="Slide 12"></section>
      <section class="slide"><img src="slides/slide-13.png" alt="Slide 13"></section>
      <section class="slide"><img src="slides/slide-14.png" alt="Slide 14"></section>
  </main>
  <div class="counter" id="counter"></div>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    let i = 0;
    const render = () => {
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      document.getElementById('counter').textContent = (i + 1) + ' / ' + slides.length;
    };
    addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
      if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) i = Math.max(0, i - 1);
      render();
    });
    render();
  </script>
</body>
</html>
