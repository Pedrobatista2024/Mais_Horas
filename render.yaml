databases:
  - name: mais-horas-db
    plan: free
    databaseName: mais_horas
    user: mais_horas

services:
  # ===== Backend (API Python/FastAPI) =====
  - type: web
    name: mais-horas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mais-horas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: APP_URL
        sync: false # cole a URL pública da API após o 1º deploy
      - key: WEB_URL
        sync: false # cole a URL do mais-horas-web (usada no QR dos certificados)
      - key: CORS_ORIGIN
        sync: false # cole a URL do mais-horas-web (ex: https://mais-horas-web.onrender.com)
        # Obrigatório em produção: a API se recusa a subir sem esta variável.

  # ===== Frontend (Vite static site) =====
  - type: web
    name: mais-horas-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false # cole aqui a URL do serviço mais-horas-api (ex: https://mais-horas-api.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
