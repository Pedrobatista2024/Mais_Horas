# Monitoramento do Mais Horas, separado da aplicação (docs/monitoramento.md).
#
# Projeto Docker à parte: sobe, cai e é apagado sem tocar no site. Entra na
# rede da aplicação (mais-horas_default) só para coletar da API e do banco, e
# para o Caddy alcançar o Grafana e os relatórios em /monitoramento.
#
# Rode de dentro de deploy/monitoramento/, depois de ./preparar.sh:
#   sudo docker compose up -d --build
#   sudo docker compose --profile demonstracao up -d --build   # com o simulador
name: mais-horas-monitoramento

services:
  # Banco de séries temporais: guarda tudo o que é coletado, por 90 dias.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB
      - --web.external-url=http://prometheus:9090/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks: [monitoramento, aplicacao]
    mem_limit: 768m

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${DOMINIO:?defina DOMINIO no .env}/monitoramento/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?defina GRAFANA_SENHA no .env}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SEGURO:-true}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Fortaleza
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/paineis/visao-geral.json
      GF_LOG_LEVEL: warn
      POSTGRES_PAINEL_SENHA: ${POSTGRES_PAINEL_SENHA:?defina POSTGRES_PAINEL_SENHA no .env}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisionamento:/etc/grafana/provisioning:ro
      - ./grafana/paineis:/etc/grafana/paineis:ro
    networks:
      monitoramento:
      aplicacao:
        aliases: [monitoramento-grafana]
    depends_on: [prometheus]
    mem_limit: 384m

  # Máquina: CPU, memória, disco e rede da VM.
  node-exporter:
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoramento]
    mem_limit: 64m

  # Containers: CPU e memória de cada um, para saber quem está pesando.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.4
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp,process
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoramento]
    mem_limit: 192m

  # Banco: conexões, transações, cache, travas e as consultas mais pesadas.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    restart: unless-stopped
    command:
      - --collector.stat_statements
      - --collector.long_running_transactions
    environment:
      DATA_SOURCE_URI: banco:5432/mais_horas?sslmode=disable
      DATA_SOURCE_USER: monitoramento
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_SENHA:?defina POSTGRES_MONITOR_SENHA no .env}
    networks: [monitoramento, aplicacao]
    mem_limit: 64m

  # Visão de fora: o site responde pela internet, com HTTPS válido?
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    networks: [monitoramento]
    mem_limit: 64m

  # Relatório em PDF com comparativo de períodos. O Caddy só deixa passar quem
  # tem sessão aberta no Grafana.
  relatorios:
    build: ./relatorios
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      BANCO_URL: postgresql://painel:${POSTGRES_PAINEL_SENHA}@banco:5432/mais_horas
      DOMINIO: ${DOMINIO}
    networks:
      monitoramento:
      aplicacao:
        aliases: [monitoramento-relatorios]
    depends_on: [prometheus]
    mem_limit: 256m

  # Uso simulado para demonstração: só sobe com --profile demonstracao.
  # Tudo o que ele cria sai com `python -m app.cli remover-demonstracao`.
  simulador:
    build: ./simulador
    profiles: [demonstracao]
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      SENHA_DEMONSTRACAO: ${SENHA_DEMONSTRACAO:?defina SENHA_DEMONSTRACAO no .env}
      INTENSIDADE: ${INTENSIDADE_DEMONSTRACAO:-1}
    networks: [aplicacao]
    mem_limit: 128m

networks:
  monitoramento: {}
  aplicacao:
    external: true
    name: mais-horas_default

volumes:
  prometheus:
  grafana:
