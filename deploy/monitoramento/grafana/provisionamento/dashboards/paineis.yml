# Os painéis vêm do repositório (grafana/paineis/*.json, gerados por
# gerar_paineis.py). Mudança feita pela tela não sobrevive: edite o gerador.
apiVersion: 1

providers:
  - name: mais-horas
    folder: Mais Horas
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/paineis
