# Testes de todo push e pull request e, no main, publicação na VM quando os
# testes passam. Sem filtro de caminho de propósito: todo commit do main é
# testado antes de ir ao ar.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Push novo cancela o anterior ainda em teste; o mais recente é que publica.
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mais_horas_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mais_horas_teste
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/mais_horas_teste
      # Valores só de teste: o boot recusa segredo vazio.
      JWT_SECRET: segredo-de-teste-do-ci
      CHECKIN_SECRET: outro-segredo-de-teste-do-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://maishoras.northcentralus.cloudapp.azure.com
    env:
      SERVIDOR: maishoras.northcentralus.cloudapp.azure.com
      # Identidade da VM fixada aqui: sem ela, um servidor impostor receberia a
      # conexão. Muda só se a VM for recriada (ssh-keyscan de novo).
      IDENTIDADE_DO_SERVIDOR: >-
        maishoras.northcentralus.cloudapp.azure.com
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINX4QQYphS2tZRlLj0pTDTpwghaJRuO7Lq6ico5yWnvL
    steps:
      - name: Publicar na VM
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Segredo DEPLOY_SSH_KEY ausente (docs/deploy.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$IDENTIDADE_DO_SERVIDOR" > ~/.ssh/known_hosts
          # A chave só consegue rodar deploy/publicar.sh; o SHA vira o argumento.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "maishoras@$SERVIDOR" "$GITHUB_SHA"

      - name: Conferir que o site respondeu
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://$SERVIDOR/saude" && exit 0
            sleep 3
          done
          echo "::error::A API não respondeu depois da publicação"
          exit 1
